name: SMPMinigames
version: '1.0.0'
main: com.lucasmuhr.minigames.MinigamesPlugin
api-version: '1.21'
author: lucasmuhr
description: SMP minigames for the server - boxing first, more to come.

commands:
  box:
    description: Boxing minigame commands
    usage: /box <join <player>|leave <player>|setring1|setring2|setspawn1|setspawn2|setexit|setboxingadmin|boxingadmin|reload>
  mg:
    description: Mass-teleport everyone online to a world and back again
    usage: /mg <sendall <world>|returnall|setspawn|setarea1|setarea2>

permissions:
  minigames.box.admin:
    description: Allows running matches and configuring the boxing arena
    default: op
  minigames.admin:
    description: Allows using minigames admin utilities like /mg
    default: op
