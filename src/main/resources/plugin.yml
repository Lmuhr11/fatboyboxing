name: SMPMinigames
version: '1.0.0'
main: com.lucasmuhr.minigames.MinigamesPlugin
api-version: '1.21'
author: lucasmuhr
description: SMP minigames for the server - boxing first, more to come.

commands:
  box:
    description: Boxing minigame commands
    usage: /box <join|leave|setring1|setring2|setspawn1|setspawn2|setexit|reload>

permissions:
  minigames.box.play:
    description: Allows joining and leaving the boxing queue
    default: true
  minigames.box.admin:
    description: Allows configuring the boxing arena
    default: op
